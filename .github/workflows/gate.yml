name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails when package.json and the lockfile have drifted, which is the one
      # check a local `npm install` can never perform — it repairs the drift
      # silently instead.
      #
      # This also installs BOTH argon2 bindings, including the node-gyp one.
      # That is deliberate: the integration tier's whole purpose is asserting
      # the two interoperate, and a CI that quietly skipped it would leave the
      # package's central migration claim untested.
      - run: npm ci

      - run: npm run type-check

      # No `--fix` anywhere in CI. A lint step that repairs the tree hides from
      # review the errors review exists to catch, and leaves the repair
      # uncommitted so the same error returns on the next checkout.
      - run: npm run lint

      # Coverage thresholds are enforced here, not just measured. In an auth
      # library the uncovered branch is, by construction, a rejection path.
      - run: npm run test:coverage

      # A green gate that examined nothing is the failure this guards against:
      # ESLint exits 0 while reporting "File ignored by default" for anything
      # under a dot-directory, and a testMatch resolving to no files also exits
      # 0. Both read as "clean".
      - name: Prove the gate was not vacuous
        run: |
          set -euo pipefail
          linted=$(npx eslint . -f json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).length))')
          sources=$(find src -name '*.ts' | wc -l)
          echo "eslint examined $linted files; src holds $sources"
          # Derived from the tree rather than a hard-coded floor. A copied
          # magic number is itself a way for this check to stop meaning
          # anything — it failed on this repo's first run for exactly that
          # reason, having been carried over from a larger package.
          test "$linted" -ge "$sources"

      # The one thing every check above is blind to: this package ships source,
      # so `files`, the `exports` map and the tarball contents are what a
      # consumer actually receives — and they break at publish time, after
      # review, on a version number that can never be reused.
      #
      # This packs it, installs the tarball into a throwaway project, and
      # type-checks and RUNS it as a consumer would. Stronger than inspecting
      # the tar listing, which cannot tell whether the code works once resolved
      # through the exports map.
      - run: npm run verify:package

      # The three publish guards (PRD-0067 R-S0, R-S2, R-S3). `npm run gate`
      # above already runs them; this names each so a red is readable from the
      # job list, and prints the size of the set each examined.
      - run: npm run check:manifest
      - run: npm run check:secrets
      - run: npm run check:tarball

  # The repository's HISTORY, not just the tree (PRD-0067 R-S2). The in-repo
  # scanner above covers the well-known credential shapes offline on every
  # machine; gitleaks covers the long tail and every commit on the branch. The
  # binary is pinned by version and its published checksum is verified, so the
  # scanner itself is not a supply-chain surprise.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch gitleaks, pinned and checksummed
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Saved under its published name: the checksum line names that file,
          # and `sha256sum -c` reads the name from the line (first run: saved as
          # gitleaks.tar.gz, "No such file or directory", the scan never ran).
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $asset\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          ./gitleaks version
      - name: Scan every commit on this ref
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
